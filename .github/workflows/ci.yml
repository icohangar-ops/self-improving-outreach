# GitHub Actions — add repository secrets with the same names as `.env.example`.
# CI itself does not need secrets: tests run in mock mode.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK_MODE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - name: Run unit tests
        run: uv sync --group dev && uv run pytest
