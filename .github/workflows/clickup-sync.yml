# Optional ClickUp → lead queue poll. CI pytest does not run this.
# Enable a schedule only after CLICKUP_API_TOKEN (and ClickHouse) secrets exist.

name: clickup-sync

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/30 * * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - name: Ingest ClickUp Queued tasks
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_LIST_ID: ${{ vars.CLICKUP_LIST_ID }}
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_DATABASE: ${{ secrets.CLICKHOUSE_DATABASE }}
          MOCK_MODE: "true"
        run: |
          uv sync --group dev
          uv run python -m self_improving_outreach clickup-sync
